<style>:root{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;color:#556985;--blue:#627caa}*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:transparent}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #83a7e0;outline-offset:3px}.widget{position:relative;height:100%;width:100%;overflow:hidden;isolation:isolate;border-radius:20px;background:radial-gradient(ellipse at 50% 27%,#fff9 4%,#dee9f4ba 56%,#bdcfe08e 100%);border:1px solid #f3f7ffad;box-shadow:inset 0 1px 26px #fff6}.widget.transparent{background:transparent;border-color:transparent;box-shadow:none}.character{position:absolute;inset:0 0 -24% 0;transform:rotate(var(--tilt,0deg)) translateY(var(--float,0px));transform-origin:50% 43%;transition:transform .4s ease}.character canvas,.character img{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 0%;mask-image:linear-gradient(to bottom,#000 0%,#000 79%,transparent 98%)}.character img{position:absolute;inset:0}.character img.hidden{display:none}.bubble{position:absolute;z-index:5;top:11px;left:10px;right:10px;max-width:320px;margin:auto;padding:10px 15px;text-align:center;background:#ffffffef;border:1px solid #cbdaf6;border-radius:16px;color:#3d5275;font-size:12px;line-height:1.65;box-shadow:0 5px 22px #536d9750;opacity:0;translate:0 -7px;pointer-events:none;transition:opacity .25s,translate .25s;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.show{opacity:1;translate:0 0}.controls{position:absolute;z-index:5;right:9px;bottom:17px;display:flex;gap:7px}.controls button{border:1px solid #b6cbe8;background:#fffdf9df;color:var(--blue);height:36px;width:36px;border-radius:50%;box-shadow:0 3px 12px #6987ac38;font-size:20px;transition:transform .2s}.controls button:hover{transform:translateY(-2px)}.model-label{position:absolute;left:12px;bottom:10px;font:8px 'Segoe UI',sans-serif;color:#6480a4;letter-spacing:1px;opacity:.72}.sparkle{position:absolute;color:#fff7;z-index:1;pointer-events:none}.sparkle.one{left:15%;top:19%;font-size:23px}.sparkle.two{right:15%;top:37%;font-size:13px}@media(prefers-reduced-motion:reduce){.character,.bubble,.controls button{transition:none!important}}
</style>
